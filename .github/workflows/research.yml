name: broad-research

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ["scripts/broad_research.py", ".github/workflows/research.yml"]

permissions:
  contents: write

concurrency:
  group: daily-update
  cancel-in-progress: false

jobs:
  research:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Broad universe backtest (no hand-picked list)
        run: python scripts/broad_research.py
      - name: Save results
        run: |
          git config user.name "ai-tracker-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/research
          git commit -m "research: broad universe $(date -u +%F)" || exit 0
          git pull --rebase origin main
          git push
