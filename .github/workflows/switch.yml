name: switch-strategy

on:
  schedule:
    - cron: "50 22 * * 1-5"     # after the US close and after daily-update (00:50 Israel time)
  workflow_dispatch:
  push:
    branches: [claude/project-thread-3o6yth]
    paths: ["scripts/switch_live.py", ".github/workflows/switch.yml"]

permissions:
  contents: write
  issues: write

concurrency:
  group: daily-update
  cancel-in-progress: false

jobs:
  switch:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Switch rule: decide, paper portfolio, target book
        working-directory: scripts
        env:
          NOTIFY_PATH: /tmp/notify.md
        run: python switch_live.py
      - name: Save
        run: |
          git config user.name "ai-tracker-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/data/switch.json docs/data/switch_target_book.json data/switch
          git commit -m "switch: $(date -u +%F)" || exit 0
          git pull --rebase origin "${GITHUB_REF_NAME}"
          git push origin "HEAD:${GITHUB_REF_NAME}"
      - name: Notify on a change (GitHub issue = email + app notification)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ -s /tmp/notify.md ]; then
            gh issue create --repo "$GITHUB_REPOSITORY" --title "המתג · $(date -u +%d.%m.%Y)" --body-file /tmp/notify.md
          fi
