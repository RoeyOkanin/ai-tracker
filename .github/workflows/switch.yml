name: switch-strategy

on:
  schedule:
    - cron: "50 22 * * 1-5"     # after the US close and after daily-update (00:50 Israel time)
  workflow_dispatch:
  push:
    branches: [main]
    paths: ["scripts/switch_live.py", "scripts/systematic_rules.py", "scripts/account_snapshot.py", ".github/workflows/switch.yml"]

permissions:
  contents: write
  issues: write

concurrency:
  group: switch-strategy      # own group: a queued daily-update must not cancel the nightly decision
  cancel-in-progress: false

jobs:
  switch:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
      - run: pip install -r requirements.txt
      - name: "Switch rule - decide, paper portfolio, target book"
        working-directory: scripts
        env:
          NOTIFY_PATH: /tmp/notify.md
        run: python switch_live.py
      - name: Order ticket for manual execution (Colmex)
        env:
          NOTIFY_PATH: /tmp/notify.md
        run: |
          if python -c "import yaml,sys;c=yaml.safe_load(open('config/execution.yaml'));sys.exit(0 if c.get('ticket_enabled') and c.get('book')=='switch' else 1)"; then
            python scripts/execute.py --broker ticket --book switch
          fi
      - name: Account snapshot for the dashboard (read-only)
        continue-on-error: true      # a broker hiccup must not stop the decision from being saved
        env:
          ALPACA_KEY_ID: ${{ secrets.ALPACA_KEY_ID }}
          ALPACA_SECRET_KEY: ${{ secrets.ALPACA_SECRET_KEY }}
        run: python scripts/account_snapshot.py
      - name: Save
        run: |
          git config user.name "ai-tracker-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          # one `git add` per path: a missing path makes git add abort and stage nothing (that is what broke the last runs)
          for f in docs/data/switch.json docs/data/switch_target_book.json data/switch \
                   data/manual_book_switch.json docs/data/account.json; do
            [ -e "$f" ] && git add "$f"
          done
          git commit -m "switch: $(date -u +%F)" || exit 0
          for i in 1 2 3; do
            git pull --rebase --autostash origin "${GITHUB_REF_NAME}" && git push origin "HEAD:${GITHUB_REF_NAME}" && exit 0
            sleep $((i * 5))
          done
          exit 1
      - name: Notify on a change (GitHub issue = email + app notification)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ -s /tmp/notify.md ]; then
            gh issue create --repo "$GITHUB_REPOSITORY" --title "המתג · $(date -u +%d.%m.%Y)" --body-file /tmp/notify.md
          fi

      - name: Alert if this run failed (GitHub issue = email + app notification)
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh issue create --repo "$GITHUB_REPOSITORY" --title "⚠️ switch-strategy נכשל · $(date -u +%d.%m.%Y)" \
            --body "הריצה נכשלה: $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
