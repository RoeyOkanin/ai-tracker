name: research-followup

on:
  workflow_dispatch:
  push:
    branches: [claude/project-thread-3o6yth]
    paths: ["scripts/systematic_rules.py", "scripts/core_satellite.py", "scripts/taiwan_lead.py",
            ".github/workflows/research-followup.yml"]

permissions:
  contents: write

jobs:
  research:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Systematic rule set (SMH as default) + walk-forward
        working-directory: scripts
        run: python systematic_rules.py
      - name: Core + satellite
        working-directory: scripts
        run: python core_satellite.py
      - name: Taiwan monthly sales lead test
        working-directory: scripts
        continue-on-error: true
        run: python taiwan_lead.py
      - name: Save results
        if: always()
        run: |
          git config user.name "ai-tracker-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/research
          git commit -m "research: systematic rules, core/satellite, Taiwan lead $(date -u +%F)" || exit 0
          git pull --rebase origin "${GITHUB_REF_NAME}"
          git push origin "HEAD:${GITHUB_REF_NAME}"
