name: bottleneck-research

on:
  workflow_dispatch:
  push:
    branches: [claude/project-thread-3o6yth]
    paths: ["scripts/bottleneck_research.py", ".github/workflows/bottleneck.yml"]

permissions:
  contents: write

jobs:
  research:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Bottleneck signal test (SEC filings, point-in-time)
        working-directory: scripts
        run: python bottleneck_research.py
      - name: Save results
        run: |
          git config user.name "ai-tracker-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/research
          git commit -m "research: bottleneck signal $(date -u +%F)" || exit 0
          git pull --rebase origin "${GITHUB_REF_NAME}"
          git push origin "HEAD:${GITHUB_REF_NAME}"
