name: trade

# Sends the orders decided at the previous close as market-on-close orders.
# Cron is off the busy :00/:05 marks (GitHub delays or drops runs there). Two slots, 18:17 and 19:23 UTC
# (13:17/14:23 New York in winter, 14:17/15:23 in summer; the MOC cutoff is 15:50). The second one is a
# backup: client_order_id is fixed per day and ticker, so a second run never doubles an order.
on:
  schedule:
    - cron: "17 18 * * 1-5"
    - cron: "23 19 * * 1-5"
  # The reliable trigger is external (docs/external-trigger.md): GitHub's own cron runs hours late on this repo.
  # It calls this dispatch with dry_run=false at 14:15 New York time. By hand the default stays a dry run.
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Plan only, send nothing"
        type: boolean
        default: true

permissions:
  contents: write
  issues: write

concurrency:
  group: trade
  cancel-in-progress: false

jobs:
  trade:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip

      - name: Install
        run: pip install -r requirements.txt

      - name: Execute target book
        env:
          ALPACA_KEY_ID: ${{ secrets.ALPACA_KEY_ID }}
          ALPACA_SECRET_KEY: ${{ secrets.ALPACA_SECRET_KEY }}
          LIVE_TRADING_CONFIRM: ${{ secrets.LIVE_TRADING_CONFIRM }}
          NOTIFY_PATH: /tmp/trade.md
        run: |
          if [ -z "$ALPACA_KEY_ID" ]; then
            echo "No ALPACA_KEY_ID secret: automatic execution is off. Nothing to do."
            exit 0
          fi
          python scripts/execute.py --broker alpaca ${{ inputs.dry_run && '--dry-run' || '' }}

      - name: Account snapshot for the dashboard (read-only)
        if: always()
        continue-on-error: true
        env:
          ALPACA_KEY_ID: ${{ secrets.ALPACA_KEY_ID }}
          ALPACA_SECRET_KEY: ${{ secrets.ALPACA_SECRET_KEY }}
        run: python scripts/account_snapshot.py

      - name: Save execution log
        run: |
          git config user.name "ai-tracker-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          for f in data/execution_log.csv docs/data/account.json; do
            [ -e "$f" ] && git add "$f"
          done
          if git diff --cached --quiet; then
            echo "nothing new"
          else
            git commit -m "trade: $(date -u +%F)"
            for i in 1 2 3; do
              git pull --rebase --autostash origin main && git push && exit 0
              sleep $((i * 5))
            done
            exit 1
          fi

      - name: Notify
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ -s /tmp/trade.md ]; then
            gh issue create --repo "$GITHUB_REPOSITORY" --title "AI Tracker · ביצוע · $(date -u +%d.%m.%Y)" --body-file /tmp/trade.md
          fi

      - name: Alert if this run failed (GitHub issue = email + app notification)
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh issue create --repo "$GITHUB_REPOSITORY" --title "⚠️ trade נכשל · $(date -u +%d.%m.%Y)" \
            --body "הריצה נכשלה: $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
