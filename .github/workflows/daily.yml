name: daily-update

on:
  schedule:
    - cron: "30 22 * * 1-5"     # 22:30 UTC, after the US close (00:30 Israel time)
  workflow_dispatch:            # manual "Run workflow" button
  push:
    branches: [main]
    paths: ["config/**", "scripts/**", ".github/workflows/**", "requirements.txt"]

permissions:
  contents: write
  issues: write

concurrency:
  group: daily-update
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip

      - name: Install
        run: pip install -r requirements.txt

      - name: Download prices
        run: python scripts/fetch_prices.py

      - name: News radar (headlines -> bottleneck signals)
        continue-on-error: true
        timeout-minutes: 15
        run: python scripts/news_radar.py

      - name: Score layers, run paper portfolio
        env:
          NOTIFY_PATH: /tmp/notify.md
        run: python scripts/compute.py

      - name: Save results to the repo
        run: |
          git config user.name "ai-tracker-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data docs
          if git diff --cached --quiet; then
            echo "nothing new"
          else
            git commit -m "data: $(date -u +%F)"
            git pull --rebase origin main
            git push
          fi

      - name: Notify (GitHub issue = email + app notification)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ -s /tmp/notify.md ]; then
            gh issue create --repo "$GITHUB_REPOSITORY" --title "AI Tracker · $(date -u +%d.%m.%Y)" --body-file /tmp/notify.md
          fi
