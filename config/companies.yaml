# כרטיס לכל חברה במערכת. החברה נכנסת לפי הערך שלה לשרשרת ה-AI, לא לפי התשואה שלה.
# הכללים המלאים: docs/universe_rules.md
#
# status:
#   active  עומדת בכל הכללים. המערכת יכולה לקנות אותה (אחרי 200 ימי מסחר לפחות).
#   watch   בעלת ערך לשרשרת אבל לא עומדת בכלל אחד (חשיפה, הכנסות, נזילות). נספרת בדירוג השכבה, לא נקנית.
#   signal  נסחרת מחוץ לארה"ב. נספרת בדירוג השכבה כאיתות, לא נקנית.
# exposure (הערכה, נבדקת כל רבעון):
#   high      רוב ההכנסות מ-AI ודאטה-סנטרים
#   medium    חלק משמעותי מההכנסות (רבע ומעלה)
#   driver    חלק קטן יותר, אבל AI ודאטה-סנטרים הם מנוע הצמיחה העיקרי
#   critical  מונופול או כמעט מונופול ברכיב שבלעדיו אין AI
#   low       חשיפה נמוכה (במעקב רק כי היא חלק מ-SMH)

