# השכבות של שרשרת האספקה של AI. החברות בכל שכבה מוגדרות ב-config/companies.yaml (כרטיס לכל חברה).
# monitor_only: שכבה שנשארת במעקב בלבד. המערכת לא קונה ממנה (בבקטסט, הכנסתן לרוטציה הורידה את התשואה).

calendar: SPY                 # לוח ימי המסחר של וול סטריט
benchmarks: [SMH, QQQ, SPY]   # SMH = תעודת סל של שבבים, מדד ההשוואה הראשי

layers:
  equipment:
    name: "ציוד וחומרים לייצור שבבים"
  design:
    name: "תכנון שבבים ו-IP"
  foundry:
    name: "ייצור ואריזה מתקדמת"
  memory:
    name: "זיכרון ואחסון"
  compute:
    name: "שבבי AI"
  networking:
    name: "רשתות, אופטיקה וקישוריות"
  servers:
    name: "שרתים ומתלים"
  power_equipment:
    name: "ציוד חשמל וקירור"
  power_generation:
    name: "ייצור חשמל"
  datacenter_reits:
    name: "נדל\"ן ופיתוח דאטה-סנטרים"
  hyperscalers:
    name: "ענקיות הענן"
  neoclouds:
    name: "ענן AI עצמאי"
  software:
    name: "תוכנה ופלטפורמות AI"
  analog_power:
    name: "שבבים אנלוגיים וחשמל (מעקב)"
    monitor_only: true
  edge_devices:
    name: "מעבדים ומכשירי קצה (מעקב)"
    monitor_only: true

