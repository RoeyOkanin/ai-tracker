# חוקי המערכת. לפני ששינוי כאן נכנס לתוקף, מריצים עליו בקטסט.

live_start: "2026-11-16"       # היום הראשון של תיק הנייר (קנייה בסגירה של היום הזה)

portfolio:
  layers_to_hold: 3            # כמה שכבות מחזיקים בכל רגע
  stocks_per_layer: 2          # כמה מניות בכל שכבה
  keep_if_rank_at_most: 5      # שכבה שכבר מוחזקת נשארת כל עוד היא בטופ 5 (נגד החלפות על רעש)
  max_weight: 0.30             # משקל מקסימלי למניה אחת
  rebalance_band: 0.02         # לא מתקנים משקל של מניה קיימת אם הפער קטן מ-2% מהתיק

regime:                        # האם מחזור ה-AI מאיץ או מאט, וכמה כסף בכלל בחוץ
  enabled: true
  benchmark: SMH
  breadth_green: 0.60          # ירוק: SMH מעל ממוצע 200 ולפחות 60% מהמניות מעל ממוצע 200
  breadth_red: 0.40            # אדום: SMH מתחת לממוצע 200 ופחות מ-40% מהמניות מעליו
  exposure: {green: 1.0, yellow: 0.6, red: 0.25}

exits:
  trailing_stop: true
  stop_mult_monthly_vol: 2.0   # מרחק הסטופ = פעמיים התנודתיות החודשית של המניה
  stop_min: 0.10               # לפחות 10% מתחת לשיא
  stop_max: 0.25               # לכל היותר 25% מתחת לשיא
  trend_exit: true
  ma200_buffer: 0.02           # יציאה כשהמחיר נסגר 2% מתחת לממוצע 200

profit_take:
  enabled: true
  week_gain: 0.20              # קפיצה של 20% ומעלה בשבוע
  above_ma50: 0.25             # וגם 25% ומעלה מעל ממוצע 50
  fraction: 0.33               # מוכרים שליש, השאר ממשיך עם הסטופ

costs_per_side: 0.0015         # עמלה + מרווח, לכל צד של עסקה
